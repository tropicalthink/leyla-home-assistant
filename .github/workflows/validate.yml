# Every push and pull request, and weekly so a Home Assistant release that
# breaks something shows up before a user does: Home Assistant's own
# checks (hassfest), HACS's, and the tests, lint and strict typing.
name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@22.5.0
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
      - run: uv venv && uv pip install -r requirements_test.txt
      - run: uv run ruff check custom_components tests
      - run: uv run ruff format --check custom_components tests
      - run: uv run mypy
      - run: uv run pytest -p no:xdist tests --cov=custom_components/leyla --cov-report=term-missing
